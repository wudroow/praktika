<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сладкие сны | Бутик-отель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #FFFFFF;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1A1A1A;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            padding-bottom: 1.5rem;
            margin-bottom: 0;
            border-bottom: 1px solid #EAEAEA;
        }
        .header-left h1 {
            font-size: 2.8rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #1A1A1A;
            font-family: 'Playfair Display', 'Times New Roman', serif;
        }
        .slogan {
            font-size: 0.9rem;
            color: #8B1E3F;
            margin-top: 0.25rem;
            letter-spacing: 0.2px;
        }
        .header-right {
            font-size: 0.8rem;
            color: #8B1E3F;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer {
            border-top: 1px solid #EAEAEA;
            padding: 2rem 2rem 0.5rem;
            margin-top: 3rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 2rem;
            font-size: 0.8rem;
            color: #666;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }
        .contacts {
            line-height: 1.6;
            text-align: right;
        }
        .contacts strong {
            color: #8B1E3F;
        }

        .filter-bar {
            background: #FAFAFA;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border: 1px solid #EEEEEE;
        }
        .filter-group {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .filter-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 450;
            color: #2C2C2C;
            cursor: pointer;
        }
        .filter-group input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            accent-color: #8B1E3F;
        }
        .btn {
            background: transparent;
            border: 1px solid #8B1E3F;
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #8B1E3F;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #8B1E3F;
            color: white;
            border: none;
        }
        .btn-primary:hover {
            background: #6B1630;
        }
        .btn-outline:hover {
            background: #FDF5F7;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 2rem;
        }
        .room-card {
            background: white;
            border: 1px solid #F0F0F0;
            transition: all 0.25s;
        }
        .room-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.04);
            border-color: #E0C9C0;
        }
        .room-img {
            background-color: #F7F2EF;
            height: 230px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .room-info {
            padding: 1.2rem 1.2rem 1.5rem;
        }
        .room-category {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: #1A1A1A;
        }
        .room-price {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0.5rem 0;
            color: #8B1E3F;
        }
        .room-features {
            font-size: 0.85rem;
            line-height: 1.4;
            color: #5A5A5A;
            margin: 0.8rem 0;
        }
        .book-btn {
            background: #8B1E3F;
            border: none;
            padding: 0.7rem;
            width: 100%;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: white;
            margin-top: 1rem;
            transition: background 0.2s;
        }
        .book-btn:hover {
            background: #6B1630;
        }

        /* СТРАНИЦА БРОНИРОВАНИЯ */
        .booking-hero {
            position: relative;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .booking-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        .booking-form-wrapper {
            position: relative;
            z-index: 2;
            max-width: 620px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }
        .booking-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        .selected-room-info {
            background: rgba(250, 250, 250, 0.9);
            padding: 1rem;
            margin-bottom: 1.8rem;
            border-left: 3px solid #8B1E3F;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
            color: #8B1E3F;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #E0E0E0;
            font-size: 0.9rem;
            background: white;
            transition: border 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #8B1E3F;
        }
        .clear-btn {
            position: absolute;
            right: 12px;
            top: 34px;
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: #aaa;
            z-index: 5;
        }
        .error-msg {
            color: #C04242;
            font-size: 0.7rem;
            margin-top: 0.3rem;
            display: block;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #8B1E3F;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 1px solid #E0C9C0;
        }
        .hint {
            font-size: 0.65rem;
            color: #aaa;
            margin-top: 0.25rem;
        }
        .date-wrapper {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            position: relative;
        }
        .date-wrapper input {
            flex: 1;
            padding-right: 70px;
        }
        .calendar-btn {
            background: white;
            border: 1px solid #8B1E3F;
            padding: 0.7rem 1rem;
            cursor: pointer;
            font-size: 0.8rem;
            color: #8B1E3F;
            font-weight: 500;
            white-space: nowrap;
        }
        .date-clear-btn {
            position: absolute;
            right: 110px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: #aaa;
            z-index: 5;
        }

        @media (max-width: 800px) {
            .container { padding: 1rem; }
            .header-left h1 { font-size: 2rem; }
            .booking-form-wrapper { padding: 2rem 1rem; }
            .booking-container { padding: 1.5rem; }
        }
    </style>
</head>

                    this.setSelectionRange(pos-1, pos-1);
                    this.dispatchEvent(new Event('input'));
                }
            }
            if (!/^\d$/.test(e.key) && !['Backspace','Delete','Tab','ArrowLeft','ArrowRight','Home','End','Enter'].includes(e.key)) e.preventDefault();
        });
    }

    function parseDateFromDMY(dateStr) {
        let match = dateStr.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        if (!match) return null;
        let day = parseInt(match[1], 10);
        let month = parseInt(match[2], 10) - 1;
        let year = parseInt(match[3], 10);
        return new Date(Date.UTC(year, month, day));
    }

    function setupDateInput(groupId, minDateStr, defaultVal = null) {
        const group = document.getElementById(groupId);
        const label = group.querySelector('label');
        const hint = group.querySelector('.hint');
        const errorSpan = group.querySelector('.error-msg');
        
        [...group.children].forEach(ch => {
            if (ch !== label && ch !== hint && ch !== errorSpan) group.removeChild(ch);
        });
        
        const wrap = document.createElement('div');
        wrap.className = 'date-wrapper';
        
        const textInput = document.createElement('input');
        textInput.type = 'text';
        textInput.placeholder = 'ДД.ММ.ГГГГ';
        
        const hiddenDate = document.createElement('input');
        hiddenDate.type = 'date';
        hiddenDate.style.position = 'absolute';
        hiddenDate.style.opacity = '0';
        hiddenDate.style.pointerEvents = 'none';
        hiddenDate.style.width = '0';
        hiddenDate.style.height = '0';
        hiddenDate.min = minDateStr;
        
        const calendarBtn = document.createElement('button');
        calendarBtn.type = 'button';
        calendarBtn.textContent = '📅';
        calendarBtn.className = 'calendar-btn';
        calendarBtn.style.fontSize = '1.2rem';
        calendarBtn.style.padding = '0.7rem 1rem';
        
        const clearBtn = document.createElement('button');
        clearBtn.innerHTML = '✕';
        clearBtn.className = 'date-clear-btn';
        
        wrap.appendChild(textInput);
        wrap.appendChild(calendarBtn);
        wrap.appendChild(clearBtn);
        wrap.appendChild(hiddenDate);
        group.appendChild(wrap);
        
        let currentValue = '';
        
        function formatDateInput() {
            let digits = textInput.value.replace(/\D/g, '');
            if (digits.length > 8) digits = digits.slice(0, 8);
            
            let day = '', month = '', year = '';
            let formatted = '';
            
            if (digits.length >= 1) {
                day = digits.slice(0, 2);
                let dayNum = parseInt(day);
                if (day.length === 2 && dayNum > 31) day = '31';
                if (day.length === 2 && dayNum < 1) day = '01';
                formatted = day;
            }
            if (digits.length >= 2) {
                formatted = day + '.';
            }
            if (digits.length >= 3) {
                month = digits.slice(2, 4);
                let monthNum = parseInt(month);
                if (month.length === 2 && monthNum > 12) month = '12';
                if (month.length === 2 && monthNum < 1) month = '01';
                formatted = day + '.' + month;
            }
            if (digits.length >= 4) {
                formatted = day + '.' + month + '.';
            }
            if (digits.length >= 5) {
                year = digits.slice(4, 8);
                let yearNum = parseInt(year);
                if (year.length === 4 && yearNum < minYear) year = String(minYear);
                if (year.length === 4 && yearNum > maxYear) year = String(maxYear);
                formatted = day + '.' + month + '.' + year;
            }
            
            if (formatted !== textInput.value) {
                let oldLen = textInput.value.length;
                let cursorPos = textInput.selectionStart;
                textInput.value = formatted;
                let newLen = textInput.value.length;
                let newPos = cursorPos + (newLen - oldLen);
                if (newPos < 0) newPos = 0;
                if (newPos > newLen) newPos = newLen;
                textInput.setSelectionRange(newPos, newPos);
            }
            
            updateValue();
        }
        
        function updateValue() {
            let dateObj = parseDateFromDMY(textInput.value);
            if (dateObj && !isNaN(dateObj.getTime())) {
                if (dateObj >= todayDate) {
                    let year = dateObj.getUTCFullYear();
                    let month = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
                    let day = String(dateObj.getUTCDate()).padStart(2, '0');
                    hiddenDate.value = `${year}-${month}-${day}`;
                    currentValue = hiddenDate.value;
                    if (errorSpan) errorSpan.innerText = '';
                } else {
                    hiddenDate.value = '';
                    currentValue = '';
                    if (textInput.value.length === 10 && errorSpan) errorSpan.innerText = `Дата не может быть раньше ${todayDisplay}`;
                }
            } else if (textInput.value.length === 10) {
                currentValue = '';
                if (errorSpan) errorSpan.innerText = 'Неверный формат, используйте ДД.ММ.ГГГГ';
            } else {
                currentValue = '';
            }
        }
        
        textInput.addEventListener('input', formatDateInput);
        
        calendarBtn.addEventListener('click', () => {
            hiddenDate.showPicker();
        });
        
        hiddenDate.addEventListener('change', () => {
            if (hiddenDate.value) {
                let [year, month, day] = hiddenDate.value.split('-');
                textInput.value = `${day}.${month}.${year}`;
                currentValue = hiddenDate.value;
                if (errorSpan) errorSpan.innerText = '';
            } else {
                textInput.value = '';
                currentValue = '';
            }
        });
        
        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            hiddenDate.value = '';
            currentValue = '';
            if (errorSpan) errorSpan.innerText = '';
            textInput.focus();
        });
        
        if (defaultVal) {
            hiddenDate.value = defaultVal;
            let [year, month, day] = defaultVal.split('-');
            textInput.value = `${day}.${month}.${year}`;
            currentValue = defaultVal;
        }
        
        return { getValue: () => currentValue };
    }

    function addClearButton(input, container) {
        let btn = document.createElement('button');
        btn.innerHTML = '✕';
        btn.className = 'clear-btn';
        btn.onclick = () => { input.value = ''; input.focus(); input.dispatchEvent(new Event('input')); };
        container.appendChild(btn);
    }

    function validateName(v) { return /^[А-Яа-яёЁ\s\.\-]+$/.test(v?.trim() || ''); }
    function validatePhone(v) { return /^\+7\(\d{3}\)\d{3}-\d{2}-\d{2}$/.test(v); }
    function validateEmail(v) { return /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(v); }
    function validateDates(s, e) { return s && e && new Date(s) < new Date(e); }

    function showMessage(text) {
        let old = document.querySelector('.toast-msg');
        if (old) old.remove();
        let div = document.createElement('div');
        div.className = 'toast-msg';
        div.innerText = text;
        div.style.position = 'fixed';
        div.style.bottom = '24px';
        div.style.left = '50%';
        div.style.transform = 'translateX(-50%)';
        div.style.backgroundColor = '#8B1E3F';
        div.style.color = 'white';
        div.style.padding = '10px 24px';
        div.style.zIndex = '1000';
        div.style.fontSize = '0.8rem';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }

    function renderCatalog() {
        let rooms = getDisplayRooms();
        let filterHtml = `
            <div class="filter-bar">
                <div class="filter-group">
                    <label><input type="checkbox" value="STANDARD" class="filter-chk" ${selectedFilters.includes('STANDARD') ? 'checked' : ''}> Стандартный</label>
                    <label><input type="checkbox" value="STUDIO" class="filter-chk" ${selectedFilters.includes('STUDIO') ? 'checked' : ''}> Студия</label>
                    <label><input type="checkbox" value="LUX" class="filter-chk" ${selectedFilters.includes('LUX') ? 'checked' : ''}> Люкс</label>
                </div>
                <div>
                    <button id="applyFilterBtn" class="btn btn-outline">Применить</button>
                    <button id="resetFilterBtn" class="btn btn-outline">Сбросить</button>
                </div>
            </div>
        `;
        let cards = '';
        for (let r of rooms) {
            cards += `
                <div class="room-card">
                    <div class="room-img" style="background-image: url('${r.imageUrl}');"></div>
                    <div class="room-info">
                        <div class="room-category">${r.categoryName}</div>
                        <div class="room-price">${r.price.toLocaleString()} ₽ / сутки</div>
                        <div class="room-features">${r.characteristics}</div>
                        <button class="book-btn" data-id="${r.id}">Забронировать</button>
                    </div>
                </div>
            `;
        }
        if (!rooms.length) cards = '<p style="margin: 2rem 0;">Нет номеров под выбранные категории</p>';
        let full = `
            <div class="header">
                <div class="header-left">
                    <h1>Сладкие сны</h1>
                    <div class="slogan">Бутик-отель в центре столицы</div>
                </div>
                <div class="header-right">тишина · комфорт · стиль</div>
            </div>
            ${filterHtml}
            <div class="catalog-grid">${cards}</div>
            <div class="footer">
                <div>© Сладкие сны</div>
                <div class="contacts">
                    <strong>Контакты</strong><br>
                    📍 Москва, ул. Сладкая, 7<br>
                    🕛 круглосуточно<br>
                    📞 +7 (495) 123-45-67<br>
                    ✉️ info@sweetdreams.ru
                </div>
            </div>
        `;
        document.getElementById('app').innerHTML = full;
        document.getElementById('applyFilterBtn').onclick = () => {
            selectedFilters = [...document.querySelectorAll('.filter-chk:checked')].map(cb => cb.value);
            renderCatalog();
        };
        document.getElementById('resetFilterBtn').onclick = () => {
            document.querySelectorAll('.filter-chk').forEach(cb => cb.checked = false);
            selectedFilters = [];
            renderCatalog();
        };
        document.querySelectorAll('.book-btn').forEach(btn => {
            btn.onclick = () => {
                let id = parseInt(btn.dataset.id);
                selectedRoom = allRooms.find(r => r.id === id);
                renderBooking();
            };
        });
    }

    function renderBooking() {
        if (!selectedRoom) return renderCatalog();
        
        let html = `
            <div class="header" style="margin-bottom: 0; border-bottom: none;">
                <div class="header-left">
                    <h1>Сладкие сны</h1>
                    <div class="slogan">Бутик-отель в центре столицы</div>
                </div>
                <div class="header-right">тишина · комфорт · стиль</div>
            </div>
            <div class="booking-hero" style="background-image: url('${selectedRoom.imageUrl}');">
                <div class="booking-form-wrapper">
                    <div class="booking-container">
                        <div class="selected-room-info">
                            <strong>${selectedRoom.categoryName}</strong> — ${selectedRoom.price.toLocaleString()} ₽/сутки<br>${selectedRoom.characteristics}
                        </div>
                        <form id="bookingForm">
                            <div class="form-group" id="fnG"><label>Имя *</label><input id="firstName"><div class="hint">Кириллица, пробелы, точки, тире</div><span class="error-msg" id="errFn"></span></div>
                            <div class="form-group" id="lnG"><label>Фамилия *</label><input id="lastName"><div class="hint">Кириллица, пробелы, точки, тире</div><span class="error-msg" id="errLn"></span></div>
                            <div class="form-group" id="phG"><label>Телефон *</label><input id="phone" placeholder="+7(123)456-78-90"><div class="hint">Только цифры, автоформат</div><span class="error-msg" id="errPh"></span></div>
                            <div class="form-group" id="emG"><label>Email *</label><input id="email"><div class="hint">name@example.ru</div><span class="error-msg" id="errEm"></span></div>
                            <div class="form-group" id="checkInGroup"><label>Дата заезда *</label><div class="hint">Введите 8 цифр — точки сами (минимум ${todayDisplay})</div><span class="error-msg" id="errCin"></span></div>
                            <div class="form-group" id="checkOutGroup"><label>Дата выезда *</label><div class="hint">Введите 8 цифр — точки сами (минимум ${todayDisplay})</div><span class="error-msg" id="errCout"></span></div>
                            <button type="submit" class="btn btn-primary" style="width:100%;">Отправить заявку</button>
                        </form>
                        <div class="back-link" id="backToCatalog">← Назад к каталогу</div>
                    </div>
                </div>
            </div>
            <div class="footer">
                <div>© Сладкие сны</div>
                <div class="contacts">
                    <strong>Контакты</strong><br>
                    📍 Москва, ул. Сладкая, 7<br>
                    🕛 круглосуточно<br>
                    📞 +7 (495) 123-45-67<br>
                    ✉️ info@sweetdreams.ru
                </div>
            </div>
        `;
        document.getElementById('app').innerHTML = html;
        
        let phone = document.getElementById('phone');
        setupPhoneInput(phone);
        
        let ci = setupDateInput('checkInGroup', todayStr, todayStr);
        let co = setupDateInput('checkOutGroup', todayStr);
        
        document.querySelectorAll('.form-group:not(#checkInGroup):not(#checkOutGroup)').forEach(g => g.style.position = 'relative');
        addClearButton(document.getElementById('firstName'), document.getElementById('fnG'));
        addClearButton(document.getElementById('lastName'), document.getElementById('lnG'));
        addClearButton(phone, document.getElementById('phG'));
        addClearButton(document.getElementById('email'), document.getElementById('emG'));
        
        document.getElementById('bookingForm').onsubmit = (e) => {
            e.preventDefault();
            let fn = document.getElementById('firstName').value.trim();
            let ln = document.getElementById('lastName').value.trim();
            let ph = phone.value.trim();
            let em = document.getElementById('email').value.trim();
            let cin = ci.getValue();
            let cout = co.getValue();
            let err = {};
            if (!validateName(fn)) err.fn = 'Только кириллица, пробелы, точки, тире';
            if (!validateName(ln)) err.ln = 'Только кириллица, пробелы, точки, тире';
            if (!validatePhone(ph)) err.ph = 'Формат +7(123)456-78-90 (10 цифр)';
            if (!validateEmail(em)) err.em = 'example@domain.ru';
            if (!cin) err.cin = `Введите дату заезда (не раньше ${todayDisplay})`;
            if (!cout) err.cout = `Введите дату выезда (не раньше ${todayDisplay})`;
            if (cin && cout && !validateDates(cin, cout)) err.dates = 'Выезд должен быть позже заезда';
            document.getElementById('errFn').innerText = err.fn || '';
            document.getElementById('errLn').innerText = err.ln || '';
            document.getElementById('errPh').innerText = err.ph || '';
            document.getElementById('errEm').innerText = err.em || '';
            document.getElementById('errCin').innerText = err.cin || err.dates || '';
            document.getElementById('errCout').innerText = err.cout || err.dates || '';
            if (Object.keys(err).length) return;
            showMessage(`✅ Заявка на номер «${selectedRoom.categoryName}» успешно отправлена!`);
            setTimeout(() => renderCatalog(), 2000);
        };
        document.getElementById('backToCatalog').onclick = () => renderCatalog();
    }
    renderCatalog();
</script>
