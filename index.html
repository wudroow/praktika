<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сладкие сны - бронирование номеров</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: black;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }

        .header {
            border-bottom: 2px solid black;
            padding: 15px 0;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: bold;
        }
        .slogan {
            font-size: 14px;
            color: #555;
            margin-top: 5px;
            font-style: italic;
        }

        .footer {
            border-top: 1px solid #aaa;
            padding: 15px 0;
            margin-top: 40px;
            font-size: 13px;
            color: #333;
        }
        .contacts {
            margin-top: 8px;
            line-height: 1.5;
        }

        .filter-bar {
            border: 1px solid black;
            padding: 15px;
            margin-bottom: 25px;
            background: white;
        }
        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .filter-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        .btn {
            background: white;
            border: 1px solid black;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        .btn:hover {
            background: #eee;
        }

        .catalog-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 10px;
        }
        .room-card {
            border: 1px solid black;
            width: calc(33.333% - 14px);
            min-width: 250px;
            background: white;
        }
        .room-img {
            background: #eaeaea;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            border-bottom: 1px solid #aaa;
        }
        .room-info {
            padding: 12px;
        }
        .room-category {
            font-weight: bold;
            font-size: 18px;
        }
        .room-price {
            font-size: 20px;
            font-weight: bold;
            margin: 8px 0;
        }
        .room-features {
            font-size: 13px;
            margin: 8px 0;
            color: #222;
        }
        .book-btn {
            background: white;
            border: 1px solid black;
            padding: 8px;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        .book-btn:hover {
            background: #ddd;
        }

        .booking-container {
            border: 1px solid black;
            padding: 20px;
            max-width: 500px;
            background: white;
        }
        .selected-room-info {
            border: 1px solid #aaa;
            padding: 12px;
            margin-bottom: 20px;
            background: #f5f5f5;
        }
        .form-group {
            margin-bottom: 15px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            padding-right: 30px;
            border: 1px solid black;
            font-size: 14px;
            background: white;
        }
        .clear-btn {
            position: absolute;
            right: 8px;
            top: 28px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #888;
            padding: 0 5px;
        }
        .clear-btn:hover {
            color: black;
        }
        .error-msg {
            color: #cc0000;
            font-size: 12px;
            margin-top: 4px;
            display: block;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: black;
            text-decoration: underline;
            cursor: pointer;
        }
        .hint {
            font-size: 11px;
            color: #555;
            margin-top: 3px;
        }

        @media (max-width: 800px) {
            .room-card {
                width: calc(50% - 10px);
            }
        }
        @media (max-width: 550px) {
            .room-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
    // ----- данные -----
    const roomTypes = {
        STANDARD: { name: "Стандартный", price: 5000, features: "18 м², двуспальная кровать, TV", icon: "🛏️" },
        STUDIO: { name: "Студия", price: 8000, features: "25 м², кухня, холодильник, диван", icon: "🍳" },
        LUX: { name: "Люкс", price: 12000, features: "40 м², джакузи, балкон, гостиная", icon: "✨" }
    };

    // генерация 12 номеров
    let allRooms = [];
    for (let i = 1; i <= 12; i++) {
        let cat;
        if (i <= 4) cat = "STANDARD";
        else if (i <= 8) cat = "STUDIO";
        else cat = "LUX";
        allRooms.push({
            id: i,
            category: cat,
            categoryName: roomTypes[cat].name,
            price: roomTypes[cat].price,
            characteristics: roomTypes[cat].features,
            imageIcon: roomTypes[cat].icon
        });
    }

    let selectedFilters = [];
    let selectedRoom = null;

    // сегодняшняя дата в формате YYYY-MM-DD для input date
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];

    function getRandomItems(arr, count) {
        let copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy.slice(0, count);
    }

    function filterRoomsByCategory(rooms, cats) {
        if (cats.length === 0) return rooms;
        return rooms.filter(r => cats.includes(r.category));
    }

    function getDisplayRooms() {
        let filtered = filterRoomsByCategory(allRooms, selectedFilters);
        return getRandomItems(filtered, 6);
    }

    // ========== ТЕЛЕФОН: автоформат + удаление скобок/дефисов ==========
    function setupPhoneInput(input) {
        input.maxLength = 18;
        
        input.addEventListener('input', function(e) {
            let cursorPos = this.selectionStart;
            let digits = this.value.replace(/\D/g, '');
            if (digits.length > 11) digits = digits.slice(0, 11);
            
            let formatted = '';
            if (digits.length === 0) {
                formatted = '';
            } else {
                formatted = '+' + digits[0];
                if (digits.length >= 2) formatted += '(' + digits.slice(1, 4);
                if (digits.length >= 4) formatted += ')' + digits.slice(4, 7);
                if (digits.length >= 7) formatted += '-' + digits.slice(7, 9);
                if (digits.length >= 9) formatted += '-' + digits.slice(9, 11);
            }
            
            if (formatted !== this.value) {
                let oldLength = this.value.length;
                this.value = formatted;
                let newLength = this.value.length;
                let newPos = cursorPos + (newLength - oldLength);
                this.setSelectionRange(Math.max(0, Math.min(newPos, newLength)), Math.max(0, Math.min(newPos, newLength)));
            }
        });
        
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace') {
                let cursorPos = this.selectionStart;
                let value = this.value;
                
                if (cursorPos > 0) {
                    let charBefore = value[cursorPos - 1];
                    if (charBefore === '(' || charBefore === ')' || charBefore === '-' || charBefore === '+') {
                        e.preventDefault();
                        let newValue = value.slice(0, cursorPos - 1) + value.slice(cursorPos);
                        this.value = newValue;
                        this.setSelectionRange(cursorPos - 1, cursorPos - 1);
                        this.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                }
            }
            
            let allowed = ['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'Enter'];
            if (allowed.includes(e.key)) return;
            if (!/^\d$/.test(e.key)) {
                e.preventDefault();
            }
        });
    }
    
    // кнопка очистки поля
    function addClearButton(input, container) {
        let clearBtn = document.createElement('button');
        clearBtn.innerHTML = '✕';
        clearBtn.className = 'clear-btn';
        clearBtn.title = 'Очистить';
        clearBtn.type = 'button';
        clearBtn.onclick = () => {
            input.value = '';
            input.focus();
            input.dispatchEvent(new Event('input', { bubbles: true }));
        };
        container.appendChild(clearBtn);
    }

    // валидация
    function validateName(value) {
        if (!value) return false;
        return /^[А-Яа-яёЁ\s\.\-]+$/.test(value.trim());
    }
    
    function validatePhone(value) {
        let pattern = /^\+7\(\d{3}\)\d{3}-\d{2}-\d{2}$/;
        return pattern.test(value);
    }
    
    function validateEmail(value) {
        if (!value) return false;
        return /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(value);
    }
    
    function validateDates(startDate, endDate) {
        if (!startDate || !endDate) return false;
        return new Date(startDate) < new Date(endDate);
    }

    function showMessage(text) {
        let oldMsg = document.querySelector('.toast-msg');
        if (oldMsg) oldMsg.remove();
        let div = document.createElement('div');
        div.className = 'toast-msg';
        div.innerText = text;
        div.style.position = 'fixed';
        div.style.bottom = '20px';
        div.style.left = '50%';
        div.style.transform = 'translateX(-50%)';
        div.style.backgroundColor = 'black';
        div.style.color = 'white';
        div.style.padding = '8px 16px';
        div.style.border = '1px solid white';
        div.style.fontSize = '14px';
        div.style.zIndex = '999';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }

    function renderCatalog() {
        let displayRooms = getDisplayRooms();

        let filterHtml = `
            <div class="filter-bar">
                <div class="filter-group">
                    <label><input type="checkbox" value="STANDARD" class="filter-chk" ${selectedFilters.includes('STANDARD') ? 'checked' : ''}> Стандартный</label>
                    <label><input type="checkbox" value="STUDIO" class="filter-chk" ${selectedFilters.includes('STUDIO') ? 'checked' : ''}> Студия</label>
                    <label><input type="checkbox" value="LUX" class="filter-chk" ${selectedFilters.includes('LUX') ? 'checked' : ''}> Люкс</label>
                </div>
                <div>
                    <button id="applyFilterBtn" class="btn">Применить</button>
                    <button id="resetFilterBtn" class="btn">Сбросить фильтр</button>
                </div>
            </div>
        `;

        let cardsHtml = '';
        for (let room of displayRooms) {
            cardsHtml += `
                <div class="room-card">
                    <div class="room-img">${room.imageIcon}</div>
                    <div class="room-info">
                        <div class="room-category">${room.categoryName}</div>
                        <div class="room-price">${room.price} ₽/сутки</div>
                        <div class="room-features">${room.characteristics}</div>
                        <button class="book-btn" data-id="${room.id}">Забронировать</button>
                    </div>
                </div>
            `;
        }

        if (displayRooms.length === 0) {
            cardsHtml = '<p style="margin:20px 0">Нет номеров подходящих под фильтр</p>';
        }

        let html = `
            <div class="header">
                <h1>Сладкие сны</h1>
                <div class="slogan">"Найди идеальный номер для своего отдыха"</div>
            </div>
            ${filterHtml}
            <div class="catalog-grid" id="catalogGrid">
                ${cardsHtml}
            </div>
            <div class="footer">
                <div>Контакты:</div>
                <div class="contacts">
                    Адрес: г. Москва, ул. Сладкая, д.7<br>
                    Режим работы: круглосуточно<br>
                    Телефон: +7 (495) 123-45-67<br>
                    E-mail: info@sweetdreams.ru
                </div>
            </div>
        `;

        document.getElementById('app').innerHTML = html;

        document.getElementById('applyFilterBtn').addEventListener('click', () => {
            let checks = document.querySelectorAll('.filter-chk');
            let newFilters = [];
            checks.forEach(ch => { if (ch.checked) newFilters.push(ch.value); });
            selectedFilters = newFilters;
            renderCatalog();
        });

        document.getElementById('resetFilterBtn').addEventListener('click', () => {
            let checks = document.querySelectorAll('.filter-chk');
            checks.forEach(ch => ch.checked = false);
            selectedFilters = [];
            renderCatalog();
        });

        document.querySelectorAll('.book-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let id = parseInt(btn.getAttribute('data-id'));
                let room = allRooms.find(r => r.id === id);
                if (room) {
                    selectedRoom = room;
                    renderBooking();
                }
            });
        });
    }

    function renderBooking() {
        if (!selectedRoom) {
            renderCatalog();
            return;
        }

        let html = `
            <div class="header">
                <h1>Сладкие сны</h1>
                <div class="slogan">Бронирование номера</div>
            </div>
            <div class="booking-container">
                <div class="selected-room-info">
                    <strong>${selectedRoom.categoryName}</strong> | ${selectedRoom.price} ₽/сутки<br>
                    ${selectedRoom.characteristics}
                </div>
                <form id="bookingForm">
                    <div class="form-group" id="firstNameGroup">
                        <label>Имя *</label>
                        <input type="text" id="firstName" autocomplete="off">
                        <div class="hint">Только кириллица, пробелы, точки, тире</div>
                        <span class="error-msg" id="error-firstName"></span>
                    </div>
                    <div class="form-group" id="lastNameGroup">
                        <label>Фамилия *</label>
                        <input type="text" id="lastName">
                        <div class="hint">Только кириллица, пробелы, точки, тире</div>
                        <span class="error-msg" id="error-lastName"></span>
                    </div>
                    <div class="form-group" id="phoneGroup">
                        <label>Телефон *</label>
                        <input type="text" id="phone" placeholder="+7(123)456-78-90">
                        <div class="hint">Вводите только цифры — формат сам появится, Backspace удаляет и скобки</div>
                        <span class="error-msg" id="error-phone"></span>
                    </div>
                    <div class="form-group" id="emailGroup">
                        <label>E-mail *</label>
                        <input type="text" id="email">
                        <div class="hint">example@mail.ru</div>
                        <span class="error-msg" id="error-email"></span>
                    </div>
                    <div class="form-group" id="checkInGroup">
                        <label>Дата заезда *</label>
                        <input type="date" id="checkIn" min="${todayStr}" value="${todayStr}">
                        <div class="hint">Выберите дату в календаре</div>
                        <span class="error-msg" id="error-checkIn"></span>
                    </div>
                    <div class="form-group" id="checkOutGroup">
                        <label>Дата выезда *</label>
                        <input type="date" id="checkOut" min="${todayStr}">
                        <div class="hint">Выберите дату в календаре</div>
                        <span class="error-msg" id="error-checkOut"></span>
                    </div>
                    <button type="submit" class="btn" style="width:100%; margin-top:5px;">Отправить заявку</button>
                </form>
                <div class="back-link" id="backToCatalog">← Назад к каталогу</div>
            </div>
            <div class="footer">
                <div>Контакты: г. Москва, ул. Сладкая, д.7 | круглосуточно | +7 (495) 123-45-67 | info@sweetdreams.ru</div>
            </div>
        `;
        document.getElementById('app').innerHTML = html;

        let phoneInput = document.getElementById('phone');
        let firstNameInput = document.getElementById('firstName');
        let lastNameInput = document.getElementById('lastName');
        let emailInput = document.getElementById('email');
        let checkInInput = document.getElementById('checkIn');
        let checkOutInput = document.getElementById('checkOut');
        
        setupPhoneInput(phoneInput);
        
        addClearButton(phoneInput, document.getElementById('phoneGroup'));
        addClearButton(firstNameInput, document.getElementById('firstNameGroup'));
        addClearButton(lastNameInput, document.getElementById('lastNameGroup'));
        addClearButton(emailInput, document.getElementById('emailGroup'));
        addClearButton(checkInInput, document.getElementById('checkInGroup'));
        addClearButton(checkOutInput, document.getElementById('checkOutGroup'));

        let allInputs = [firstNameInput, lastNameInput, phoneInput, emailInput];
        allInputs.forEach(inp => {
            inp.addEventListener('input', () => {
                let errSpan = document.getElementById(`error-${inp.id}`);
                if (errSpan) errSpan.innerText = '';
            });
        });
        
        checkInInput.addEventListener('change', () => {
            document.getElementById('error-checkIn').innerText = '';
            document.getElementById('error-checkOut').innerText = '';
        });
        checkOutInput.addEventListener('change', () => {
            document.getElementById('error-checkIn').innerText = '';
            document.getElementById('error-checkOut').innerText = '';
        });

        document.getElementById('bookingForm').addEventListener('submit', (e) => {
            e.preventDefault();
            let firstName = firstNameInput.value.trim();
            let lastName = lastNameInput.value.trim();
            let phone = phoneInput.value.trim();
            let email = emailInput.value.trim();
            let checkIn = checkInInput.value;
            let checkOut = checkOutInput.value;

            let errors = {};
            
            if (!validateName(firstName)) errors.firstName = 'Используйте кириллицу, пробелы, точки или тире';
            if (!validateName(lastName)) errors.lastName = 'Используйте кириллицу, пробелы, точки или тире';
            if (!validatePhone(phone)) errors.phone = 'Введите 10 цифр — телефон отформатируется в +7(123)456-78-90';
            if (!validateEmail(email)) errors.email = 'Пример: name@domain.ru';
            
            if (!checkIn) {
                errors.checkIn = 'Выберите дату заезда';
            }
            if (!checkOut) {
                errors.checkOut = 'Выберите дату выезда';
            }
            if (checkIn && checkOut && !validateDates(checkIn, checkOut)) {
                errors.dates = 'Дата выезда должна быть позже даты заезда';
            }

            document.getElementById('error-firstName').innerText = errors.firstName || '';
            document.getElementById('error-lastName').innerText = errors.lastName || '';
            document.getElementById('error-phone').innerText = errors.phone || '';
            document.getElementById('error-email').innerText = errors.email || '';
            document.getElementById('error-checkIn').innerText = errors.checkIn || errors.dates || '';
            document.getElementById('error-checkOut').innerText = errors.checkOut || errors.dates || '';

            if (Object.keys(errors).length > 0) return;

            showMessage(`✅ Заявка на номер "${selectedRoom.categoryName}" успешно отправлена!`);
            setTimeout(() => {
                renderCatalog();
            }, 2000);
        });

        // Кнопка "Назад к каталогу" — теперь работает
        document.getElementById('backToCatalog').addEventListener('click', (e) => {
            e.preventDefault();
            renderCatalog();
        });
    }

    renderCatalog();
</script>
</body>
</html>
